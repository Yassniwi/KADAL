<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ chatbot_name }} - Ocean Study Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(160deg, #0b3d5c, #1a7fa8);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .chat-container {
            width: 100%;
            max-width: 720px;
            height: 90vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #0b5a80;
            color: #ffffff;
            padding: 18px 20px;
        }

        .chat-header h1 {
            font-size: 1.3rem;
        }

        .chat-header p {
            font-size: 0.85rem;
            opacity: 0.85;
            margin-top: 4px;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #eef6fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 0.95rem;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user {
            align-self: flex-end;
            background: #0b5a80;
            color: #ffffff;
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background: #ffffff;
            color: #1c2b33;
            border: 1px solid #d3e4ec;
            border-bottom-left-radius: 4px;
        }

        .message.typing {
            font-style: italic;
            color: #6b8593;
        }

        .chat-input {
            display: flex;
            gap: 10px;
            padding: 14px;
            border-top: 1px solid #d3e4ec;
            background: #ffffff;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 14px;
            border: 1px solid #b8d2df;
            border-radius: 24px;
            font-size: 0.95rem;
            outline: none;
        }

        .chat-input input:focus {
            border-color: #0b5a80;
        }

        .chat-input button {
            padding: 0 22px;
            background: #0b5a80;
            color: #ffffff;
            border: none;
            border-radius: 24px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #094966;
        }

        .chat-input button:disabled {
            background: #8fb0c2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>&#127754; {{ chatbot_name }}</h1>
            <p>Ask me anything about oceans</p>
        </div>

        <div class="chat-messages" id="messages">
            <div class="message bot">Hello! I'm {{ chatbot_name }}. Ask me anything about oceans, marine life, currents, tides, and more.</div>
        </div>

        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your ocean question here..." autocomplete="off">
            <button id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        const messagesBox = document.getElementById("messages");
        const userInput = document.getElementById("userInput");
        const sendBtn = document.getElementById("sendBtn");
        const history = [];

        function addMessage(text, type) {
            const div = document.createElement("div");
            div.className = "message " + type;
            div.textContent = text;
            messagesBox.appendChild(div);
            messagesBox.scrollTop = messagesBox.scrollHeight;
            return div;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage(text, "user");
            userInput.value = "";
            sendBtn.disabled = true;

            const typing = addMessage("Thinking...", "bot typing");

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: text, history: history })
                });
                const data = await response.json();
                typing.remove();
                addMessage(data.reply, "bot");
                history.push({ role: "user", text: text });
                history.push({ role: "model", text: data.reply });
            } catch (error) {
                typing.remove();
                addMessage("Network error. Please try again.", "bot");
            }

            sendBtn.disabled = false;
            userInput.focus();
        }

        sendBtn.addEventListener("click", sendMessage);
        userInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") sendMessage();
        });
    </script>
</body>
</html>
